{% extends 'base.html' %}
{% block content %}
  {% from "_page.html" import page_header %}
  <div class="update-content">
    <div class="container">
      {{ page_header([(title, None) ]) }}
      <div class="status-message status-error">
        <strong>{{ error }}</strong>
        <p class="small mb-0 mt-1">{{ timenow }} • {{ fullversion }}</p>
      </div>
      {% if errorinfo %}
        <details class="mt-3">
          <summary>Details</summary>
          <pre class="small mt-2">{{ errorinfo }}</pre>
        </details>
      {% endif %}
    </div>
  </div>
{% endblock %}
