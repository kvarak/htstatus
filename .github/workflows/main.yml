name: CI

on:
  push:
    branches-ignore: [ test/* ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & policy checks
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install UV
        run: pip install uv
      - name: Install dependencies
        run: make install
      - name: Run ruff linting and black check
        run: make lint
      - name: Check file formatting
        run: make fileformat
      - name: Check CHPP API usage policy
        run: make check-chpp

  test:
    runs-on: ubuntu-latest
    name: Tests
    services:
      postgres:
        image: postgres:13-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: htplanner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/htplanner_test
    steps:
      - name: Check out source repository
        uses: actions/checkout@v4
      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install UV
        run: pip install uv
      - name: Install dependencies
        run: make install
      - name: Create config from template
        run: cp config.py.example config.py
      - name: Run test suite with coverage
        run: uv run pytest tests/ -q
