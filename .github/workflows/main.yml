name: CI

on:
  push:
    branches-ignore: [ test/* ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint & policy checks
    steps:
      - name: Check out source repository
        uses: actions/checkout@v7
      - name: Set up Python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install UV
        run: pip install uv
      - name: Install dependencies
        run: make install
      - name: Run ruff linting and black check
        run: make lint
      - name: Check file formatting
        run: make fileformat
      - name: Check CHPP API usage policy
        run: make check-chpp

  test:
    runs-on: ubuntu-latest
    name: Tests
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: htplanner_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/htplanner_test
    steps:
      - name: Check out source repository
        uses: actions/checkout@v7
      - name: Set up Python environment
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install UV
        run: pip install uv
      - name: Install dependencies
        run: make install
      - name: Create config from template
        run: cp config.py.example config.py
      - name: Run test suite with coverage
        run: uv run pytest tests/ -q

  docker:
    runs-on: ubuntu-latest
    name: Docker image
    needs: [lint, test]
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out source repository (full history and tags for the version)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The image has no .git: the /changes data and the version are made here.
      - name: Generate changelog data
        run: bash scripts/changelog.sh
      - name: Compute image name and version
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/htstatus-web" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags)" >> "$GITHUB_OUTPUT"
      - name: Log in to GitHub Container Registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # QEMU emulates arm64 on the x86 runner so one image runs on PCs and the Pi
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build (and on main, push) the image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
