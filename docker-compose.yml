services:
  # PostgreSQL database
  postgres:
    image: postgres:17-alpine
    container_name: htplanner_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-htplanner}
      POSTGRES_USER: ${POSTGRES_USER:-htplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-htplanner} -d ${POSTGRES_DB:-htplanner}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - htplanner_network

  # The app as it runs in production (gunicorn), built locally: `make docker-up`
  web:
    build:
      context: .
      target: runtime
    image: ${WEB_IMAGE:-htstatus-web:local}
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-htplanner}:${POSTGRES_PASSWORD:-development}@postgres:5432/${POSTGRES_DB:-htplanner}
      FLASK_ENV: production
    ports:
      - "127.0.0.1:${WEB_PORT:-5010}:8000"
    volumes:
      - web_instance:/app/instance
    # A TCP connect proves gunicorn accepts requests without adding lines to the access log
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 2)"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - htplanner_network
    profiles:
      - web

  # Lint and tests inside the image: `make docker-check`
  test:
    build:
      context: .
      target: test
    image: htstatus-test:local
    environment:
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-htplanner}:${POSTGRES_PASSWORD:-development}@postgres:5432/htplanner_test
      CI: "true"   # skip local_only tests (they need .env and git tags)
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - htplanner_network
    profiles:
      - test

  # pgAdmin for database administration (development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: htplanner_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@htplanner.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-development}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - htplanner_network
    profiles:
      - admin

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  web_instance:
    driver: local

networks:
  htplanner_network:
    driver: bridge
